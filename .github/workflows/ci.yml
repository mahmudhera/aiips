# Build, test, and smoke-test aiips on every push to main.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1" # Matches environment.yml.
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test coverage badge script
        run: scripts/test_coverage_badge.sh

  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Keep fixtures and scripts byte-identical to the repository on Windows.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary
        run: cargo build --locked --release
      - name: Run tests
        run: cargo test --locked
      - name: Smoke-test subcommands
        run: scripts/smoke.sh target/release/aiips

  # Measures line coverage of src/ (reported, never enforced) and, on main,
  # publishes a shields.io endpoint file to the orphan `badges` branch.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Only to force-push the badge file to `badges`.
    env:
      IGNORE_TESTS: "(^|/)tests/" # Excludes test code, including tests/common.
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: coverage-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      # Runs the full test suite instrumented, including the aiips binary that
      # the integration tests launch.
      - name: Measure coverage
        run: |
          cargo llvm-cov --locked --ignore-filename-regex "$IGNORE_TESTS" \
            --json --summary-only --output-path coverage-summary.json
      - name: Report coverage by file
        run: |
          {
            echo '### Line coverage of `src/`'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE_TESTS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Build badge file
        run: scripts/coverage_badge.sh coverage-summary.json coverage.json && cat coverage.json
      - name: Publish badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=$(mktemp -d)
          cp coverage.json "$dir/"
          cd "$dir"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage badge for ${GITHUB_SHA}"
          # Force-push keeps `badges` at one commit. GITHUB_TOKEN pushes do not
          # trigger workflows, so this cannot loop.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
